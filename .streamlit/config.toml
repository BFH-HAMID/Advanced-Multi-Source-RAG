# Streamlit configuration for local + container + proxied (iframe) deployments.
[server]
address = "0.0.0.0"
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f6feb"

[client]
toolbarMode = "minimal"
showErrorDetails = true

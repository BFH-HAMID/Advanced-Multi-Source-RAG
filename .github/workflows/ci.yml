name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Generate demo data
        run: python scripts/generate_samples.py

      - name: Lint (ruff)
        run: ruff check src app scripts tests

      - name: Tests (offline: hashing embeddings + lexical reranker + extractive LLM)
        env:
          LLM_PROVIDER: extractive
          EMBEDDING_BACKEND: hashing
          RERANKER_BACKEND: lexical
        run: pytest tests -q

      - name: End-to-end smoke test (ingest → index → ask)
        env:
          LLM_PROVIDER: extractive
          EMBEDDING_BACKEND: hashing
          RERANKER_BACKEND: lexical
        run: |
          python scripts/build_index.py --reset
          python scripts/ask.py "How many days of annual leave do employees get?" > answer.txt
          cat answer.txt
          grep -q "employee_handbook.pdf" answer.txt

      - name: Evaluation smoke test
        env:
          LLM_PROVIDER: extractive
          EMBEDDING_BACKEND: hashing
          RERANKER_BACKEND: lexical
        run: python scripts/run_eval.py --mode heuristic --max-samples 2 --no-baseline

services:
  rag:
    build: .
    image: enterprise-rag:latest
    container_name: enterprise-rag
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      # Point Ollama calls at the companion service when using LLM_PROVIDER=ollama
      OLLAMA_BASE_URL: http://ollama:11434
      AUTO_INGEST_SAMPLES: "true"
    volumes:
      - ./data:/app/data
      - huggingface-cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Optional: local LLM runtime. Pull a model once:
  #   docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    container_name: enterprise-rag-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  huggingface-cache:
  ollama-models:

  <circle r="3.3" fill="#8b9cc4"><animateMotion dur="3.2s" begin="0.0s" repeatCount="indefinite"><mpath href="#r2-0"/></animateMotion></circle><circle r="3.3" fill="#8b9cc4" opacity="0.3"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite"><mpath href="#r2-0"/></animateMotion></circle><circle r="3.3" fill="#8b9cc4"><animateMotion dur="3.2s" begin="0.5s" repeatCount="indefinite"><mpath href="#r2-1"/></animateMotion></circle><circle r="3.3" fill="#8b9cc4" opacity="0.3"><animateMotion dur="3.2s" begin="2.1s" repeatCount="indefinite"><mpath href="#r2-1"/></animateMotion></circle><circle r="3.3" fill="#8b9cc4"><animateMotion dur="3.2s" begin="1.0s" repeatCount="indefinite"><mpath href="#r2-2"/></animateMotion></circle><circle r="3.3" fill="#8b9cc4" opacity="0.3"><animateMotion dur="3.2s" begin="2.6s" repeatCount="indefinite"><mpath href="#r2-2"/></animateMotion></circle><circle r="3.3" fill="#fbbf24"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite"><mpath href="#r3-0"/></animateMotion></circle><circle r="3.3" fill="#fbbf24" opacity="0.3"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#r3-0"/></animateMotion></circle><circle r="3.3" fill="#fbbf24"><animateMotion dur="2.4s" begin="0.35s" repeatCount="indefinite"><mpath href="#r3-1"/></animateMotion></circle><circle r="3.3" fill="#fbbf24" opacity="0.3"><animateMotion dur="2.4s" begin="1.5s" repeatCount="indefinite"><mpath href="#r3-1"/></animateMotion></circle><circle r="3.3" fill="#fbbf24"><animateMotion dur="2.4s" begin="0.7s" repeatCount="indefinite"><mpath href="#r3-2"/></animateMotion></circle><circle r="3.3" fill="#fbbf24" opacity="0.3"><animateMotion dur="2.4s" begin="1.9s" repeatCount="indefinite"><mpath href="#r3-2"/></animateMotion></circle><circle r="3.3" fill="#fbbf24"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite"><mpath href="#r4-0"/></animateMotion></circle><circle r="3.3" fill="#fbbf24" opacity="0.3"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#r4-0"/></animateMotion></circle><circle r="3.3" fill="#5eead4"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite"><mpath href="#r5-0"/></animateMotion></circle><circle r="3.3" fill="#5eead4" opacity="0.3"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#r5-0"/></animateMotion></circle><circle r="3.3" fill="#5eead4"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite"><mpath href="#r5-1"/></animateMotion></circle><circle r="3.3" fill="#5eead4" opacity="0.3"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#r5-1"/></animateMotion></circle>
